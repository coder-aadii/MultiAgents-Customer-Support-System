name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MCSS_ENV: test
      MCSS_DATABASE_URL: postgresql+psycopg://mcss:change-me@localhost:5432/mcss
      MCSS_JWT_SECRET: ci-test-secret-not-for-production-123456
      MCSS_LLM_BASE_URL: fake
      MCSS_LLM_API_KEY: ""
      MCSS_EMBEDDING_MODEL: fake
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mcss
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: mcss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcss -d mcss"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install API dependencies
        working-directory: api
        run: poetry install --no-interaction

      - name: Apply and verify migrations
        working-directory: api
        run: |
          poetry run alembic upgrade head
          poetry run alembic current

      - name: Run API tests with fake provider
        working-directory: api
        run: poetry run pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            widget/package-lock.json
            e2e/package-lock.json

      - name: Install and verify admin web
        working-directory: admin-web
        run: |
          npm ci
          npm run type-check
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Install and verify widget
        working-directory: widget
        run: |
          npm ci
          npm run type-check
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright scaffold
        working-directory: e2e
        run: npm run test

      - name: Validate Compose configuration
        run: docker compose config --quiet

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
