[tool.poetry]
name = "mcss-api"
version = "0.1.0"
description = "MCSS API - Multi-Agent Customer Support System"
authors = ["MCSS Contributors"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
alembic = "^1.13.0"
psycopg = { extras = ["binary", "pool"], version = "^3.2.0" }
pgvector = "^0.2.5"
celery = { extras = ["redis"], version = "^5.4.0" }
redis = "^5.2.0"
httpx = "^0.27.0"
structlog = "^25.1.0"
pypdf = "^6.21.4"
python-multipart = "^0.0.32"
cryptography = "^50.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.8.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "W"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Security",
    "fastapi.File",
    "fastapi.Form",
    "app.dependencies.get_current_user",
    "app.dependencies.require_staff",
    "app.dependencies.require_admin",
    "app.dependencies.get_visitor_session",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["celery.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.tasks.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
